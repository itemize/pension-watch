name: pension-watch

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "실행 모드 (normal=일반, --test=현재 상태 전송, --demo=지정 날짜로 알림 테스트)"
        type: choice
        options: [normal, --test, --demo]
        default: normal
      dates:
        description: "--demo 전용: 체크인 날짜 (쉼표 구분, 예: 2026-11-03,2026-11-07)"
        required: false
        default: "2026-11-03,2026-11-07"

concurrency:
  group: pension-watch
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # 실행 간 state.json 유지 (중복 알림 방지, 연속 오류 횟수 기록)
      - uses: actions/cache/restore@v6
        with:
          path: state.json
          key: state-${{ github.run_id }}
          restore-keys: state-

      - name: Check availability
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          MODE: ${{ github.event.inputs.mode }}
          DATES: ${{ github.event.inputs.dates }}
        run: |
          case "$MODE" in
            --test) python check.py --test ;;
            --demo) python check.py --demo "$DATES" ;;
            *) python check.py ;;
          esac

      - uses: actions/cache/save@v6
        if: always() && hashFiles('state.json') != ''
        with:
          path: state.json
          key: state-${{ github.run_id }}
