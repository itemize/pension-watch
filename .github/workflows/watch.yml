name: pension-watch

on:
  schedule:
    # 한국 시간 05:03, 13:03, 21:03 (cron은 UTC 기준: KST = UTC+9)
    # 정각은 GitHub 혼잡 시간대라 몇 분 비켜서 실행
    - cron: "3 20,4,12 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "실행 모드 (normal=일반, --test=현재 상태 전송, --demo=지정 날짜로 알림 테스트, --summary=월간 현황 전송)"
        type: choice
        options: [normal, --test, --demo, --summary]
        default: normal
      dates:
        description: "--demo 전용: 체크인 날짜 (쉼표 구분, 예: 2026-12-05,2026-12-19)"
        required: false
        default: "2026-12-05,2026-12-19"

concurrency:
  group: pension-watch
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # 실행 간 state.json 유지 (중복 알림 방지, 연속 오류 횟수 기록)
      - uses: actions/cache/restore@v6
        with:
          path: state.json
          key: state-${{ github.run_id }}
          restore-keys: state-

      - name: Check availability
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          MODE: ${{ github.event.inputs.mode }}
          DATES: ${{ github.event.inputs.dates }}
        run: |
          case "$MODE" in
            --test) python check.py --test ;;
            --demo) python check.py --demo "$DATES" ;;
            --summary) python check.py --summary ;;
            *) python check.py ;;
          esac

      - uses: actions/cache/save@v6
        if: always() && hashFiles('state.json') != ''
        with:
          path: state.json
          key: state-${{ github.run_id }}
